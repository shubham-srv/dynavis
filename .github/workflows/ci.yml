name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  # Fast feedback: everything that needs no browser and no server.
  verify:
    name: typecheck · lint · palette · unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Measures the palette that actually ships, parsed out of globals.css (PLAN §11.5).
      - run: npm run validate:palette
      # Coverage thresholds are configured to fail the build, not just report (PLAN §14).
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  # Everything that needs a built app and a real browser.
  browser:
    name: e2e · accessibility · performance
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Playwright starts and stops its own server (see playwright.config.ts).
      - name: End-to-end
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # pa11y-ci cannot start a server, so bring one up and wait for it.
      - name: Start server for pa11y
        run: |
          npm run start &
          for _ in $(seq 1 60); do
            curl -sf http://localhost:3000 >/dev/null && exit 0
            sleep 1
          done
          echo "server did not become ready in 60s" >&2
          exit 1

      - name: Accessibility (pa11y-ci, WCAG2AA)
        run: npm run a11y

      # lhci starts its own server; stop ours first so the port is free.
      - name: Stop server
        run: pkill -f "next start" || true

      - name: Performance budgets
        run: npm run lhci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse
          path: .lighthouseci/
          retention-days: 7
